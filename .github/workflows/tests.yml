name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: 校验脚本可执行（零依赖那两个）
        run: |
          python tools/style-lint.py README.md || true
          python tools/business_language.py route README.md

      - name: 隐私闸门自检 —— 仓库里不该出现聊天语料
        run: python tools/check_local_privacy.py
